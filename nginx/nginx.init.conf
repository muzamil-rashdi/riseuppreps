# Temporary config — used ONLY for the initial certbot SSL certificate request.
# After SSL is obtained, docker-compose switches to nginx.prod.conf automatically.
server {
    listen 80;
    server_name riseupprepsacademy.com www.riseupprepsacademy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Setting up SSL...';
        add_header Content-Type text/plain;
    }
}
